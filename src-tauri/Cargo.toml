[package]
name = "vigil-ai-agent"
version = "4.0.0"
description = "Vigil AI Agent — personal desktop AI coding agent"
authors = ["Vigil"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "vigil_ai_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables child Webviews (embed official extension sites inside the IDE).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "2"
base64 = "0.22"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Local repo ops only (no HTTPS/SSH remotes) — avoids openssl-sys on macOS.
git2 = { version = "0.20", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_System_SystemServices",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pam = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
